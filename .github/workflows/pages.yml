name: Publish Project Lab

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full 40-character Project Lab commit ID
        required: true
        type: string
      api_origin:
        description: Approved HTTPS Render API origin, without a path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: project-lab-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Abdul-RahmanSayed/Project-Lab' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REVIEWED_COMMIT: ${{ inputs.source_commit }}
      VITE_FDA_API_ORIGIN: ${{ inputs.api_origin }}
    steps:
      - name: Require a fixed source checkpoint
        shell: bash
        run: |
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Use the locally checked Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm --prefix web ci
      - name: Test frontend
        run: npm --prefix web test
      - name: Build the checked saved overview and frontend
        run: npm --prefix web run build:deployment
      - name: Record the deployed frontend and backend pair
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('deployment/release.lock.json', 'utf8'));
          const manifest = {
            sourceCommit: process.env.REVIEWED_COMMIT,
            apiOrigin: process.env.VITE_FDA_API_ORIGIN,
            releaseId: release.releaseId,
            archiveSha256: release.archive.sha256,
            nodeVersion: process.version,
          };
          writeFileSync('generated/deployment/site/Project-Lab/deployment.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Upload only the built website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: generated/deployment/site/Project-Lab
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the reviewed website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
