<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        const theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch { document.documentElement.style.colorScheme = 'dark'; }
    </script>
    <meta name="theme-color" content="#00766e" />
    <meta name="description" content="Explore a saved FDA food adverse-event report snapshot by year and raw suspect-product name." />
    <title>FDA Explorer | Project Lab</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
